{% extends "base.html" %}
{% block content %}
<div id="project">
    <h1>Создать новый матч</h1>
</div>
<div id="project">
<form action="/new-match" method="post">
    <div class="field">
        <label class="label">Имя игрока 1</label>
        <div class="control">
            <input name="player1" class="input" type="text" placeholder="Имя Фамилия">
        </div>
    </div>
    <div class="field">
        <label class="label">Имя игрока 2</label>
        <div class="control">
            <input name="player2" class="input" type="text" placeholder="Имя Фамилия">
        </div>
    </div>
    <div class="field is-grouped">
        <div class="control">
            <input type="submit" class="button is-link" value="начать">
        </div>
    </div>
</form>
</div>
{% endblock %}
